[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localgp-information-gathering"
version = "0.1.0"
description = "Local Gaussian process information gathering research workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "gymnasium>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
training = ["torch>=2.2,<3", "tensorboard>=2.16,<3"]

[tool.setuptools.packages.find]
include = ["forth*", "localgp*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
