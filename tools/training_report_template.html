<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalGP · 可复现实验</title><style>
:root{color-scheme:dark;--bg:#10171e;--panel:#16232e;--ink:#e9f1f5;--muted:#a3b6c3;--line:#304453;--accent:#b8ef71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;gap:16px}h1{font-size:25px;margin:0}h2{font-size:20px;margin:24px 0 12px}.muted{color:var(--muted);font-size:14px}p{margin:12px 0}select,button{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--ink)}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:16px 0}.content{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:24px}.map{width:100%;aspect-ratio:1;display:block;background:var(--panel);border:1px solid var(--line)}.range{flex:1;min-width:180px}input[type=range]{width:100%;accent-color:var(--accent)}.primary{background:var(--accent);color:#162219;font-weight:600}.stats>div{border-bottom:1px solid var(--line);padding:16px 0}.stats label{font-size:14px;color:var(--muted);display:block}.value{font-size:26px;font-variant-numeric:tabular-nums}.series{display:flex;gap:16px;font-size:14px;flex-wrap:wrap}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}td,th{padding:12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}td:first-child,th:first-child{text-align:left}.note{border-left:3px solid var(--accent);padding-left:16px;margin:22px 0}footer{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}@media(max-width:760px){main{padding:16px}.content{grid-template-columns:1fr}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}header{display:block}.value{font-size:23px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<header><div><h1>LocalGP / 可复现实验</h1><div class="muted">连续动作 · 集中训练与分散执行 · 真实逐帧记录</div></div><span id="config" class="muted"></span></header>
<div class="controls"><label>策略 <select id="policy"><option value="trained">训练策略</option><option value="greedy">感知贪心基线</option></select></label><label>图层 <select id="layer"><option value="mean">GP 预测均值</option><option value="std">GP 预测标准差</option></select></label><label><input id="truth" type="checkbox">显示真实用户（仅评估可见）</label></div>
<div class="content"><section><canvas id="map" class="map" width="780" height="780" role="img" aria-label="真实逐帧无人机位置与局部高斯过程预测"></canvas><p class="muted">横轴：x（米） · 纵轴：y（米，向上递增） · 浅色表示较高值；白色虚线为已知地图边界；色阶在同一策略回合内固定：<output id="scale"></output>。</p><div class="series" id="legend"></div><div class="controls"><button class="primary" id="play">播放</button><label class="range">步数 <output id="step"></output><input id="frame" type="range" min="0" value="0" aria-label="选择时间步"></label></div></section>
<aside class="stats"><div><label>当前服务覆盖率</label><span class="value" id="coverage"></span></div><div><label>当前总吞吐量</label><span class="value" id="throughput"></span><span class="muted"> Mbps</span></div><div><label>已用航程 · 机群合计</label><span class="value" id="distance"></span><span class="muted"> m</span></div><div><label>累计拒绝移动事件</label><span class="value" id="collisions"></span></div><div><label>当前团队奖励</label><span class="value" id="reward"></span></div><div><label>预测 RMSE · 对数信号空间</label><span class="value" id="error"></span></div></aside></div>
<h2>独立测试场景的配对对照</h2><p class="muted" id="seeds"></p><div class="table-scroll"><table><thead><tr><th>策略</th><th>统一窗口覆盖率</th><th>统一窗口吞吐量（Mbps）</th><th>累计传输量（Mbit）</th><th>平均航程（m）</th><th>平均拒绝事件</th></tr></thead><tbody id="comparison"></tbody></table></div>
<div class="note">表中使用相同的完整时间窗口。<span id="window-note"></span>数值为场景均值 ± 样本标准差。检查点仍按预定的验证回合内平均吞吐量选择，未根据本测试结果重选。这里只有一个已训练检查点，不能据此宣称跨训练种子的统计显著性。GP 方差是融合后的不确定性代理；通信模型尚未做真实场景校准。</div>
<footer id="provenance"></footer>
</main><script type="application/json" id="data">__TRAINING_DATA__</script><script>
'use strict';const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),colors=['#b8ef71','#71ceef','#e8aeed'];let episode,frame,timer=null,domains={};
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false')}
function choose(){stop();episode=data.episodes[$('policy').value];frame=episode.frames.length-1;$('frame').max=frame;$('frame').value=frame;domains={};for(const key of ['mean','std']){let min=Infinity,max=-Infinity;for(const f of episode.frames)for(const row of f[key])for(const v of row){min=Math.min(min,v);max=Math.max(max,v)}domains[key]=[min,max]}draw()}
function draw(){const f=episode.frames[frame],c=$('map'),ctx=c.getContext('2d'),size=episode.configuration.environment.area_size,pad=48,span=684,grid=f.mean.length,key=$('layer').value,[min,max]=domains[key],cell=span/grid;ctx.clearRect(0,0,780,780);for(let x=0;x<grid;x++)for(let y=0;y<grid;y++){const t=(f[key][x][y]-min)/(max-min||1);ctx.fillStyle=key==='mean'?`rgb(${22+150*t},${39+170*t},${52+60*t})`:`rgb(${25+120*t},${40+100*t},${58+120*t})`;ctx.fillRect(pad+x*cell,pad+(grid-y-1)*cell,cell+.3,cell+.3)}const point=p=>[pad+p[0]/size*span,pad+span-p[1]/size*span];ctx.font='16px system-ui';ctx.fillStyle='#a3b6c3';ctx.strokeStyle='#304453';ctx.lineWidth=.5;for(let t=0;t<=5;t++){const value=t*size/5,x=pad+t*span/5,y=pad+span-t*span/5;ctx.textAlign='center';ctx.fillText(value.toFixed(0),x,span+pad+25);ctx.textAlign='right';ctx.fillText(value.toFixed(0),pad-8,y+5);ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,pad+span);ctx.moveTo(pad,y);ctx.lineTo(pad+span,y);ctx.stroke()}
{const bounds=f.bounds||[[0,0],[size,size]];const lo=point(bounds[0]),hi=point(bounds[1]);ctx.fillStyle='rgba(8,16,22,.72)';ctx.fillRect(pad,pad,span,hi[1]-pad);ctx.fillRect(pad,lo[1],span,pad+span-lo[1]);ctx.fillRect(pad,hi[1],lo[0]-pad,lo[1]-hi[1]);ctx.fillRect(hi[0],hi[1],pad+span-hi[0],lo[1]-hi[1]);ctx.strokeStyle='#e6edf2';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(lo[0],hi[1],hi[0]-lo[0],lo[1]-hi[1]);ctx.setLineDash([])}if($('truth').checked){ctx.fillStyle='#fff';for(const p of f.users){const q=point(p);ctx.fillRect(q[0]-2,q[1]-2,4,4)}}f.positions.forEach((p,i)=>{ctx.strokeStyle=colors[i%3];ctx.lineWidth=2.5;ctx.beginPath();episode.frames.slice(0,frame+1).forEach((r,j)=>{const xy=point(r.positions[i]);j?ctx.lineTo(...xy):ctx.moveTo(...xy)});ctx.stroke();const xy=point(p);ctx.fillStyle=colors[i%3];ctx.beginPath();ctx.arc(...xy,6,0,2*Math.PI);ctx.fill();ctx.textAlign='left';ctx.fillText(`0${i+1}`,Math.min(xy[0]+10,pad+span-28),Math.max(pad+18,xy[1]-10))});$('scale').textContent=`${min.toFixed(3)} → ${max.toFixed(3)}`;$('step').textContent=`${f.step} / ${episode.frames.at(-1).step}`;$('coverage').textContent=(100*f.metrics.coverage).toFixed(1)+'%';$('throughput').textContent=(f.metrics.throughput_bps/1e6).toFixed(3);$('distance').textContent=f.metrics.distance_m.toFixed(1);$('collisions').textContent=f.metrics.collisions;$('reward').textContent=f.reward?f.reward.team_reward.toFixed(3):'—';$('error').textContent=f.metrics.prediction_rmse.toFixed(3);c.setAttribute('aria-label',`策略 ${episode.policy} 时间步 ${f.step}，覆盖率 ${(f.metrics.coverage*100).toFixed(1)}%，显示${key==='mean'?'预测均值':'预测标准差'}`)}
$('policy').addEventListener('change',choose);$('layer').addEventListener('change',draw);$('truth').addEventListener('change',draw);$('frame').addEventListener('input',()=>{stop();frame=Number($('frame').value);draw()});$('play').addEventListener('click',()=>{if(timer!==null){stop();return}if(frame===episode.frames.length-1){frame=0;$('frame').value=0;draw()}$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{frame++;$('frame').value=frame;draw();if(frame===episode.frames.length-1)stop()},250)});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
const labels={trained:'训练策略',random:'随机策略',greedy:'感知贪心',straight:'固定向右半速',waypoint:'无感知随机航点',stationary:'原地不动'};for(const [name,r] of Object.entries(data.comparison.results)){const row=document.createElement('tr');const cells=[labels[name]];for(const [metric,scale] of [['horizon_coverage',100],['horizon_throughput_bps',1e-6],['delivered_megabits',1],['distance_m',1],['collisions',1]]){const v=r.summary[metric];cells.push(`${(v.mean*scale).toFixed(2)} ± ${(v.std*scale).toFixed(2)}${metric==='horizon_coverage'?'%':''}`)}for(const s of cells){const td=document.createElement('td');td.textContent=s;row.append(td)}$('comparison').append(row)}const seeds=data.comparison.results.trained.seeds;$('seeds').textContent=`${seeds.length} 个测试场景，种子 ${seeds[0]}–${seeds.at(-1)}。上方回放展示种子 ${data.episodes.trained.seed}。`;const cfg=data.episodes.trained.configuration;$('window-note').textContent=cfg.environment.enforce_distance_budget===false?`本实验不设航程预算，全部策略运行完整 ${cfg.environment.horizon*cfg.environment.dt} 秒。`:'按任务定义提前结束的回合，剩余窗口不再计入服务。';for(let i=0;i<cfg.environment.agents;i++){const span=document.createElement('span');span.style.color=colors[i%3];span.textContent=`● AeBS ${String(i+1).padStart(2,'0')}`;$('legend').append(span)}$('config').textContent=`种子 ${cfg.training.seed} · 检查点 ${data.comparison.checkpoint_step ?? '—'} 步 · ${cfg.environment.agents} 架 AeBS / ${data.episodes.trained.frames[0].users.length} 位用户 · ${(data.comparison.evaluation_device || cfg.training.device).toUpperCase()} 评估`;$('provenance').textContent=`检查点 SHA-256：${data.comparison.checkpoint_sha256} · 数据来自本次训练后的独立评估，原始记录与报告保存在同一目录。`;choose();
</script></body></html>
